<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtros de Imagem - Estilo Instagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background"></div>
  <header>
    <h1>Filtros de Imagem - Estilo Instagram</h1>
    <p>Experimente modos de mesclagem aplicados no lendário Supra!</p>
  </header>

  <main class="container">
    <div class="wrapper">
      <img id="image" src="supra.webp" alt="Toyota Supra Laranja">
      <div id="blend" class="blend-layer"></div>
    </div>

    <div class="controls">
      <label for="blendMode">Escolha um modo de mesclagem:</label>
      <select id="blendMode">
        <option value="normal">Normal</option>
        <option value="multiply">Multiply</option>
        <option value="screen">Screen</option>
        <option value="overlay">Overlay</option>
        <option value="darken">Darken</option>
        <option value="lighten">Lighten</option>
        <option value="color-burn">Color Burn</option>
        <option value="color-dodge">Color Dodge</option>
        <option value="difference">Difference</option>
        <option value="soft-light">Soft Light</option>
        <option value="hard-light">Hard Light</option>
        <option value="hue">Hue</option>
        <option value="saturation">Saturation</option>
        <option value="color">Color</option>
        <option value="luminosity">Luminosity</option>
      </select>
    </div>
  </main>

  <footer>
    <p>Desenvolvido para a disciplina de Desenho Técnico e Computação Gráfica © 2025</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
