<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filtros de Mesclagem - Estilo Instagram</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem;
    }
    h1 { color: #ff7a59; }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    img {
      max-width: 80vw;
      border-radius: 10px;
      transition: filter 0.3s ease;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }
    button {
      border: none;
      background: #ff7a59;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #e66344; }
    .explanation {
      margin-top: 2rem;
      max-width: 800px;
      background: #fff;
      padding: 1rem 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .formula {
      font-family: monospace;
      background: #f0f0f0;
      padding: 0.3rem 0.5rem;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Filtros de Mesclagem - Estilo Instagram</h1>
  <div class="container">
    <img id="photo" src="images/sample.png" alt="Imagem Base" />
    <div class="controls">
      <button onclick="setFilter('none')">Normal</button>
      <button onclick="setFilter('multiply')">Multiply</button>
      <button onclick="setFilter('screen')">Screen</button>
      <button onclick="setFilter('overlay')">Overlay</button>
      <button onclick="setFilter('darken')">Darken</button>
      <button onclick="setFilter('lighten')">Lighten</button>
      <button onclick="setFilter('difference')">Difference</button>
      <button onclick="setFilter('exclusion')">Exclusion</button>
    </div>
  </div>

  <div class="explanation">
    <h2 id="filterName">Modo: Normal</h2>
    <p id="filterDesc">O modo <strong>Normal</strong> substitui diretamente a cor base pela cor da camada aplicada.</p>
    <p class="formula" id="filterMath">result = S</p>
  </div>

  <script>
    const photo = document.getElementById('photo');
    const filterName = document.getElementById('filterName');
    const filterDesc = document.getElementById('filterDesc');
    const filterMath = document.getElementById('filterMath');

    const filters = {
      'none': {
        name: 'Normal',
        desc: 'Substitui diretamente a cor base pela cor da camada aplicada.',
        css: 'none',
        math: 'result = S'
      },
      'multiply': {
        name: 'Multiply',
        desc: 'Escurece a imagem multiplicando os valores de cor base e da camada e dividindo por 255.',
        css: 'contrast(1.2) brightness(0.9)',
        math: 'result = floor((B * S) / 255)'
      },
      'screen': {
        name: 'Screen',
        desc: 'Clareia a imagem invertendo as cores, multiplicando e invertendo novamente.',
        css: 'brightness(1.2)',
        math: 'result = 255 - floor(((255 - B) * (255 - S)) / 255)'
      },
      'overlay': {
        name: 'Overlay',
        desc: 'Combina Multiply e Screen. Se a base é escura, escurece mais; se é clara, clareia mais.',
        css: 'contrast(1.3) saturate(1.1)',
        math: 'if B < 128: 2*B*S/255 else: 255 - 2*(255-B)*(255-S)/255'
      },
      'darken': {
        name: 'Darken',
        desc: 'Mantém o valor mínimo entre base e camada, escurecendo o resultado.',
        css: 'brightness(0.85)',
        math: 'result = min(B, S)'
      },
      'lighten': {
        name: 'Lighten',
        desc: 'Mantém o valor máximo entre base e camada, clareando o resultado.',
        css: 'brightness(1.15)',
        math: 'result = max(B, S)'
      },
      'difference': {
        name: 'Difference',
        desc: 'Subtrai os valores de cor e usa o valor absoluto da diferença.',
        css: 'invert(0.8)',
        math: 'result = |B - S|'
      },
      'exclusion': {
        name: 'Exclusion',
        desc: 'Semelhante ao Difference, mas com menor contraste geral.',
        css: 'invert(0.6)',
        math: 'result = B + S - 2*B*S/255'
      }
    };

    function setFilter(type) {
      const f = filters[type];
      photo.style.filter = f.css;
      filterName.innerText = "Modo: " + f.name;
      filterDesc.innerText = f.desc;
      filterMath.innerText = f.math;
    }
  </script>
</body>
</html>
